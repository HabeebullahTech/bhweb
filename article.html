<style>
  :root{
    --olive:#3B5612; --olive-deep:#2c400d; --green:#6AB547; --pink:#F31573; --plum:#2B0A4A;
    --white:#FFFFFF; --soft:#F8FAF7; --olive-tint:#eef3e6; --olive-tint-2:#e2ead6;
    --line:#dde5d3; --ink:#20301a; --muted:#5b6b53;
    --font-body:'Poppins',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    --container:1180px; --gutter:clamp(20px,5vw,64px);
  }
  *,*::before,*::after{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  @media (prefers-reduced-motion:reduce){ html{scroll-behavior:auto;} *{animation-duration:.001ms !important; transition-duration:.001ms !important;} }
  body{margin:0; font-family:var(--font-body); color:var(--ink); background:var(--white); line-height:1.65; -webkit-font-smoothing:antialiased;}
  img{max-width:100%; display:block;}
  .sr-only{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap;}
  h1,h2,h3,h4{color:var(--olive); margin:1.4em 0 .5em; line-height:1.25; letter-spacing:-0.01em;}
  h1{font-weight:800; margin-top:0;} h2{font-weight:700; font-size:1.4rem;} h3{font-weight:600; font-size:1.15rem;}
  p{margin:0 0 1.1em; color:var(--ink);}
  a{color:var(--olive);}
  .container{max-width:var(--container); margin:0 auto; padding-left:var(--gutter); padding-right:var(--gutter);}
  .skip-link{position:absolute; left:-999px; top:0; background:var(--plum); color:#fff; padding:12px 20px; z-index:200; border-radius:0 0 8px 0;}
  .skip-link:focus{left:0;}
  :focus-visible{outline:3px solid var(--pink); outline-offset:3px;}

  .btn{display:inline-flex; align-items:center; gap:8px; padding:12px 24px; border-radius:999px 999px 999px 6px; font-weight:600; font-size:0.92rem; text-decoration:none; border:2px solid transparent; cursor:pointer; transition:transform .15s ease, background .15s ease;}
  .btn:hover{transform:translateY(-2px);}
  .btn-primary{background:var(--pink); color:#fff;}
  .btn-primary:hover{background:#d80f63;}
  .btn-outline{background:transparent; color:var(--olive); border-color:var(--olive);}
  .btn-outline:hover{background:var(--olive); color:#fff;}

  header.site-header{position:sticky; top:0; z-index:100; background:rgba(255,255,255,0.95); backdrop-filter:saturate(180%) blur(10px); border-bottom:1px solid var(--line);}
  .nav-wrap{display:flex; align-items:center; justify-content:space-between; padding:10px 0;}
  .brand img{height:60px; width:auto;}
  nav.primary-nav{display:flex; align-items:center; gap:8px;}
  nav.primary-nav a{text-decoration:none; color:var(--ink); font-weight:500; font-size:0.95rem; padding:10px 12px;}
  nav.primary-nav a:hover{color:var(--olive);}
  @media (max-width:900px){ nav.primary-nav{display:none;} }

  .demo-banner{background:#fff4e0; color:#7a4b06; border-bottom:1px solid #f0d9a8; font-size:0.82rem; text-align:center; padding:8px 16px;}

  .breadcrumbs{font-size:0.82rem; color:var(--muted); padding:20px 0 0;}
  .breadcrumbs a{color:var(--muted); text-decoration:none;}
  .breadcrumbs a:hover{color:var(--olive);}
  .breadcrumbs span[aria-current]{color:var(--olive); font-weight:600;}

  .article-header{padding:20px 0 30px; max-width:820px;}
  .cat-chip{display:inline-block; background:var(--olive-tint); color:var(--olive); font-size:0.76rem; font-weight:700; padding:4px 12px; border-radius:999px; margin-bottom:16px;}
  .article-header h1{font-size:clamp(1.8rem,4vw,2.5rem); max-width:20ch;}
  .article-sub{color:var(--muted); font-size:1.05rem; max-width:60ch;}
  .article-meta-row{display:flex; flex-wrap:wrap; gap:6px 16px; font-size:0.85rem; color:var(--muted); margin-top:18px; align-items:center;}
  .article-meta-row .avatar{width:26px; height:26px; border-radius:50%; background:var(--olive-tint); display:inline-flex; align-items:center; justify-content:center;}

  .article-hero-media{
    max-width:var(--container); margin:0 auto var(--gutter); padding:0 var(--gutter);
  }
  .hero-media-inner{
    height:260px; border-radius:20px; background:linear-gradient(135deg, var(--olive) 0%, var(--olive-deep) 100%);
    display:flex; align-items:center; justify-content:center;
  }
  .hero-media-inner svg{width:100px; height:100px;}

  .article-layout{display:grid; grid-template-columns:220px 1fr; gap:48px; align-items:start; max-width:var(--container); margin:0 auto; padding:0 var(--gutter) 60px;}
  .toc-wrap{position:sticky; top:90px;}
  .toc-wrap h4{font-size:0.78rem; text-transform:uppercase; letter-spacing:0.04em; color:var(--muted); margin-bottom:12px;}
  .toc-wrap ul{list-style:none; margin:0; padding:0; border-left:2px solid var(--line); display:grid; gap:2px;}
  .toc-wrap a{display:block; padding:6px 0 6px 14px; font-size:0.86rem; color:var(--muted); text-decoration:none; border-left:2px solid transparent; margin-left:-2px;}
  .toc-wrap a:hover, .toc-wrap a.active{color:var(--olive); border-left-color:var(--green); font-weight:600;}
  .share-box{margin-top:28px; display:flex; gap:8px;}
  .share-box a, .share-box button{
    width:36px; height:36px; border-radius:50%; border:1px solid var(--line); background:#fff; display:flex;
    align-items:center; justify-content:center; cursor:pointer; color:var(--olive);
  }
  .share-box a:hover, .share-box button:hover{background:var(--olive-tint);}

  .article-body{max-width:720px;}
  .article-body blockquote{
    margin:1.6em 0; padding:18px 24px; border-left:4px solid var(--green); background:var(--soft); border-radius:0 12px 12px 0;
    font-style:italic; color:var(--olive-deep);
  }
  .article-body ul, .article-body ol{padding-left:22px; margin:0 0 1.1em;}
  .article-body li{margin-bottom:6px;}
  .article-body table{width:100%; border-collapse:collapse; margin:1.4em 0; font-size:0.92rem;}
  .article-body th, .article-body td{border:1px solid var(--line); padding:10px 12px; text-align:left;}
  .article-body th{background:var(--olive-tint); color:var(--olive);}
  .ref-box{background:var(--soft); border:1px dashed #b9c7ab; border-radius:14px; padding:20px 22px; margin:1.6em 0; font-size:0.88rem; color:var(--muted);}
  .article-figure{margin:1.8em 0; text-align:center;}
  .article-figure svg{width:100%; max-width:360px; height:auto; margin:0 auto; display:block;}
  .article-figure figcaption{font-size:0.82rem; color:var(--muted); margin-top:10px; font-style:italic;}
  .ref-box strong{color:var(--olive);}
  .disclaimer{background:#fff4e0; border:1px solid #f0d9a8; border-radius:12px; padding:16px 20px; font-size:0.86rem; color:#7a4b06; margin:1.6em 0;}

  .contextual-cta{
    margin:2.4em 0; background:var(--plum); border-radius:20px 20px 20px 6px; padding:30px 32px; color:#fff;
    display:flex; align-items:center; justify-content:space-between; gap:20px; flex-wrap:wrap;
  }
  .contextual-cta h3{color:#fff; margin:0 0 4px;}
  .contextual-cta p{color:rgba(255,255,255,0.78); margin:0;}

  .author-box{
    display:flex; gap:16px; align-items:flex-start; background:var(--soft); border:1px solid var(--line);
    border-radius:16px; padding:24px; margin-top:40px; max-width:720px;
  }
  .author-box .avatar-lg{width:56px; height:56px; border-radius:50%; background:var(--olive-tint); display:flex; align-items:center; justify-content:center; flex-shrink:0;}
  .author-box h4{margin:0 0 4px; font-size:1rem;}
  .author-box p{font-size:0.87rem; color:var(--muted); margin:0;}

  .related-section{background:var(--soft); padding:56px 0; margin-top:20px;}
  .related-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:22px; max-width:var(--container); margin:0 auto; padding:0 var(--gutter);}
  .related-card{background:#fff; border:1px solid var(--line); border-radius:16px; overflow:hidden; text-decoration:none; display:flex; flex-direction:column;}
  .rc-media{height:110px; background:linear-gradient(135deg, var(--olive-tint) 0%, var(--olive-tint-2) 100%); display:flex; align-items:center; justify-content:center;}
  .rc-media svg{width:38px; height:38px;}
  .related-card .rc-body{padding:16px 18px;}
  .related-card h3{font-size:0.94rem; color:var(--plum); margin-bottom:6px;}
  .related-card p{font-size:0.8rem; color:var(--muted); margin:0;}

  .not-found{max-width:600px; margin:80px auto; text-align:center; padding:0 var(--gutter);}

  footer{background:var(--plum); color:rgba(255,255,255,0.72); padding:44px 0 26px; margin-top:20px;}
  .footer-top{display:flex; align-items:center; justify-content:space-between; gap:20px; flex-wrap:wrap; margin-bottom:24px; max-width:var(--container); margin-left:auto; margin-right:auto; padding:0 var(--gutter);}
  .footer-logo-box{background:#fff; border-radius:14px; padding:8px 14px; display:inline-flex;}
  .footer-logo-box img{height:42px; width:auto;}
  footer a{color:rgba(255,255,255,0.7); text-decoration:none; font-size:0.88rem;}
  footer a:hover{color:#fff;}
  .footer-bottom{border-top:1px solid rgba(255,255,255,0.14); padding-top:18px; font-size:0.8rem; color:rgba(255,255,255,0.5); text-align:center;}

  @media (max-width:900px){
    .article-layout{grid-template-columns:1fr;}
    .toc-wrap{position:static; margin-bottom:30px;}
    .related-grid{grid-template-columns:1fr;}
  }
  @media print{
    header, footer, .toc-wrap, .share-box, .contextual-cta, .related-section, .demo-banner{display:none;}
  }
</style>
</head>

    title:"How to Build a Sustainable Muroja'ah Routine",
    subtitle:'Memorizing new pages is only half the work. What the Qur\u2019an and the Sunnah teach us about keeping it, and a practical way to build a revision routine that lasts.',
    excerpt:"Memorizing new pages is only half the work. Here is what the Prophet ﷺ taught about revision, and a practical, realistic way to build a routine that lasts.",
    author:Abeebullah (Abu AbdilLah), publishDate:'2026-08-12', updatedDate:'2026-09-09', readingTime:9, icon:'quran',
    content:
      '<p>Ask most Qur\u2019an students what they struggle with, and the answer is rarely new memorization. It is keeping what they already memorized. This is the problem Muroja\u2019ah, ongoing revision, is designed to solve, and it is a problem the Prophet ﷺ addressed directly, more than once.</p>' +
      '<h2 id="what-is-muroja-ah">What Muroja\u2019ah actually is</h2>' +
      '<p>Muroja\u2019ah simply means revisiting what has already been memorized, on a regular schedule, so it stays fresh rather than fading. It is not a punishment for forgetting. It is the ordinary, expected maintenance that memorization requires, and the Sunnah treats it as essential rather than optional.</p>' +
      '<h2 id="what-the-prophet-taught">What the Prophet ﷺ taught about losing the Qur\u2019an</h2>' +
      '<p>Three related hadiths, all found in Sahih al-Bukhari, describe what happens to memorization that is not maintained. Ibn \u2018Umar reported that the Messenger of Allah ﷺ said:</p>' +
      '<blockquote>"The example of the companion of the Qur\u2019an is like the owner of tied camels. If he keeps them tied, he will hold them; but if he releases them, they will run away."<br><span style="font-size:0.82em; font-style:normal; color:#5b6b53;">Sahih al-Bukhari 5031</span></blockquote>' +
      '<p>Abu Musa reported a second, similarly direct warning:</p>' +
      '<blockquote>"Commit yourself to the Qur\u2019an, for by Him in whose Hand is my soul, it is surely more prone to break away than a camel in its bind."<br><span style="font-size:0.82em; font-style:normal; color:#5b6b53;">Sahih al-Bukhari 5033</span></blockquote>' +
      '<p>And in a third narration, the Prophet ﷺ corrected a common way of describing forgetfulness itself:</p>' +
      '<blockquote>"It is a bad thing that some of you say, \u2018I have forgotten such-and-such verse of the Qur\u2019an,\u2019 for indeed, he has been caused (by Allah) to forget it. So you must keep on reciting the Qur\u2019an because it escapes from the hearts of men faster than camels do."<br><span style="font-size:0.82em; font-style:normal; color:#5b6b53;">Sahih al-Bukhari 5032</span></blockquote>' +

          '<path d="M40 178 L60 168 M320 182 L300 172" fill="none" stroke="#F31573" stroke-width="2.5" stroke-linecap="round"/>' +
        '</svg>' +
        '<figcaption>An unhobbled camel wanders off quickly. A tied one stays. The Prophet ﷺ used this image for the Qur\u2019an in the heart: held by regular attention, lost through neglect.</figcaption>' +
      '</figure>' +
      '<h2 id="the-quranic-reminder">The Qur\u2019anic reminder behind revision</h2>' +
      '<p>The Qur\u2019an itself points to this same idea from a different angle, not as a warning but as reassurance. Four times in Surah Al-Qamar, Allah repeats:</p>' +
      '<blockquote>"And We have certainly made the Qur\u2019an easy for remembrance, so is there any who will remember?"<br><span style="font-size:0.82em; font-style:normal; color:#5b6b53;">Qur\u2019an 54:17 (also 54:22, 54:32, 54:40) &middot; Sahih International translation</span></blockquote>' +
      '<p>Read alongside the hadiths above, the two ideas fit together rather than contradict each other. The Qur\u2019an is made easy to remember, but "easy" still requires the regular, deliberate attention the hadiths describe. Ease is not the same as automatic.</p>' +
      '<h2 id="why-it-gets-neglected">Why revision gets neglected</h2>' +
      '<p>New pages feel like visible progress. Revision feels like standing still. That feeling is misleading, because a student who stops adding new pages but revises consistently keeps their Qur\u2019an. A student who only adds new pages without revising loses it just as fast as they gained it, exactly as the hadiths describe.</p>' +
      '<h2 id="building-the-routine">Building a routine that survives a busy week</h2>' +
      '<p>A sustainable routine is boring by design. It should not depend on motivation. Some starting principles:</p>' +
      '<ul>' +
        '<li>Fix a daily minimum you can keep even on your worst day, and treat exceeding it as a bonus, not the standard.</li>' +
        '<li>Revise in the same order each time where possible, so gaps become obvious quickly.</li>' +
        '<li>Pair revision with a fixed time of day rather than "whenever there is time."</li>' +
        '<li>Track it somewhere visible, even a simple checklist, so missed days are noticed immediately rather than weeks later.</li>' +
      '</ul>' +
      '<h3 id="a-simple-weekly-shape">A simple weekly shape to start with</h3>' +
      '<table>' +
        '<thead><tr><th>Day</th><th>Focus</th><th>Roughly how much</th></tr></thead>' +
        '<tbody>' +
          '<tr><td>Saturday to Wednesday</td><td>Recent memorization (last 1 to 2 juz)</td><td>Daily, short and consistent</td></tr>' +
          '<tr><td>Thursday</td><td>Older memorization, further back</td><td>A longer session</td></tr>' +
          '<tr><td>Friday</td><td>Weakest surah of the week</td><td>Focused, corrected with a teacher</td></tr>' +
        '</tbody>' +
      '</table>' +
      '<p>This is a starting shape, not a fixed prescription. A teacher or accountability partner can help adjust it to how much has actually been memorized and how it is holding up.</p>' +
      '<h2 id="the-role-of-accountability">The role of accountability</h2>' +
      '<p>Most people revise more consistently when someone else is expecting an update. This is the thinking behind BaytulHub\u2019s accountability partner system within the Academy, where a dedicated partner checks in on a student\u2019s Muroja\u2019ah rather than leaving it entirely to self-discipline.</p>' +
      '<div class="ref-box"><strong>Sources referenced in this article</strong><br>Sahih al-Bukhari 5031, 5032 and 5033 (sunnah.com), and Qur\u2019an 54:17 (Sahih International translation). Hadith gradings and translations should still be checked against a qualified source before this article is published in its final form, and any additional rulings should go through scholarly review first.</div>' +
      '<h2 id="starting-small">Starting small, honestly</h2>' +
      '<p>If your current Muroja\u2019ah routine does not exist, the honest first step is not an ambitious schedule. It is picking a daily minimum small enough that skipping it feels indefensible, and building from there, the same way the Prophet ﷺ described holding on to a tied camel rather than trying to recapture one that has already run off.</p>'
  },
  {
    id:2, slug:'help-child-relationship-with-quran', category:'parenting',
    tags:['Parenting','Children','Qur\'an'], featured:false, ctaType:'academy',
    title:'Helping Your Child Build a Relationship With the Qur\u2019an',
    subtitle:'Memorization sticks better when a child feels connected to the Qur\u2019an, not just tested on it. Practical starting points for parents, grounded in why the Qur\u2019an itself matters so much.',
    excerpt:'Memorization is easier when a child feels connected to the Qur\u2019an, not just tested on it. Some practical starting points for parents.',
    author:Mubarakah (Ummu AbdilLah), publishDate:'2026-08-05', updatedDate:'2026-09-09', readingTime:7, icon:'family',
    content:
      '<p>Many parents focus on how many pages their child has memorized this month. That number matters less than something harder to measure: whether the child actually enjoys their time with the Qur\u2019an, and whether that time is building a relationship that will outlast childhood.</p>' +
      '<figure class="article-figure">' +
        '<svg viewBox="0 0 400 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="parentChildFigTitle">' +
          '<title id="parentChildFigTitle">A simple line illustration of a parent and child sitting together reading</title>' +
          '<rect width="400" height="200" fill="#F8FAF7"/>' +
          '<circle cx="150" cy="70" r="22" fill="none" stroke="#3B5612" stroke-width="3"/>' +
          '<path d="M110 150 q6 -46 40 -46 q34 0 40 46 Z" fill="none" stroke="#3B5612" stroke-width="3"/>' +
          '<circle cx="248" cy="92" r="15" fill="none" stroke="#F31573" stroke-width="3"/>' +
          '<path d="M220 150 q4 -34 28 -34 q24 0 28 34 Z" fill="none" stroke="#F31573" stroke-width="3"/>' +
          '<path d="M150 150 q45 -14 90 -2" fill="none" stroke="#6AB547" stroke-width="4" stroke-linecap="round"/>' +
          '<path d="M175 146 l40 -4 l1 8 l-40 4 Z" fill="#eef3e6" stroke="#3B5612" stroke-width="2"/>' +
          '<line x1="195" y1="144" x2="195" y2="154" stroke="#3B5612" stroke-width="1.4"/>' +
        '</svg>' +
        '<figcaption>Time spent together with the Qur\u2019an, not only correction time, is part of what makes the relationship last.</figcaption>' +
      '</figure>' +
      '<h2 id="why-this-relationship-matters">Why this relationship matters so much</h2>' +
      '<p>The Prophet ﷺ placed learning and teaching the Qur\u2019an at the very top of what a Muslim can excel at:</p>' +
      '<blockquote>"The best of you are those who learn the Qur\u2019an and teach it."<br><span style="font-size:0.82em; font-style:normal; color:#5b6b53;">Sahih al-Bukhari 5027</span></blockquote>' +
      '<p>That single sentence is worth sitting with as a parent. It does not say the best of you are the fastest memorizers, or the ones with the clearest Arabic accent. It says the best of you are those who learn it and pass it on, which is exactly the role a parent plays long before any teacher does.</p>' +
      '<h2 id="start-with-meaning">Start with meaning, not just recitation</h2>' +
      '<p>Where possible, talk with your child about what a surah means in simple language before or after they memorize it. A child who understands even the general theme of what they are reciting tends to retain it differently than one reciting sound alone.</p>' +
      '<h2 id="protect-the-mood">Protect the mood around Qur\u2019an time</h2>' +
      '<p>If Qur\u2019an time is consistently associated with frustration or punishment, that association is hard to undo later. Where correction is needed, it helps to separate the correction from the child\u2019s sense of being loved and encouraged.</p>' +
      '<ul>' +
        '<li>Celebrate consistency, not only speed.</li>' +
        '<li>Let your child hear you or older siblings reciting too, not only being tested on it themselves.</li>' +
        '<li>Keep sessions short enough that your child leaves wanting more, not relieved it is over.</li>' +
      '</ul>' +
      '<h2 id="stay-involved">Stay involved without micromanaging</h2>' +
      '<p>Parent involvement, in the form of asking how a lesson went or sitting in occasionally, tends to matter more to a child\u2019s motivation than parents often expect, even without the parent knowing Arabic themselves. The hadith above puts the learner and the teacher in the same category of excellence, which includes a parent who is still learning alongside their child.</p>' +
      '<div class="ref-box"><strong>Sources referenced in this article</strong><br>Sahih al-Bukhari 5027 (sunnah.com). As with all Islamic content on this site, gradings and wording should be verified against a qualified source before final publication.</div>'
  },
  {
    id:3, slug:'first-time-pilgrim-hajj-guide', category:'hajj-umrah',
    tags:['Hajj','Preparation'], featured:false, ctaType:'hajj',
    title:'What Every First-Time Pilgrim Should Know Before Hajj',
    subtitle:'Practical and spiritual preparation matter equally.',
    excerpt:'Practical and spiritual preparation matter equally. An overview of what to think through before you travel.',
    author:Abeebullah (Abu AbdilLah), publishDate:'2026-07-28', updatedDate:null, readingTime:6, icon:'kaaba',
    content:
      '<p>Hajj brings together physical endurance, precise rites and a particular state of heart, all at once, often in a country you have never visited before. First-time pilgrims tend to underestimate how much preparation helps.</p>' +
      '<h2 id="know-the-rites-before-you-travel">Know the rites before you travel</h2>' +
      '<p>Learning the sequence of Hajj in a classroom or guided setting, before you are standing in the middle of it, reduces stress considerably. This is the reasoning behind step-by-step simulation as part of Hajj training, so the rites feel familiar rather than overwhelming.</p>' +
      '<h2 id="physical-preparation">Physical preparation</h2>' +
      '<p>Hajj involves long periods of walking and standing, often in heat. Building some physical stamina in the months before travel is worth taking seriously, particularly for older pilgrims or those with health conditions.</p>' +
      '<div class="disclaimer">This article is for general educational purposes and does not replace personalised guidance from a qualified Hajj trainer or scholar, particularly for specific fiqh rulings that apply to your situation.</div>' +
      '<h2 id="spiritual-preparation">Spiritual preparation</h2>' +
      '<p>Many pilgrims focus almost entirely on logistics and arrive without having prepared their heart for the journey. Setting aside time before travel to reflect on your intention, and to settle disputes or debts, is part of traditional preparation for Hajj.</p>' +
      '<h2 id="common-first-timer-mistakes">Common first-timer mistakes</h2>' +
      '<ul>' +
        '<li>Overpacking, then struggling to manage luggage during moves between sites.</li>' +
        '<li>Underestimating how tiring the crowds and heat can be.</li>' +
        '<li>Not confirming the specific rulings that apply to their chosen type of Hajj in advance.</li>' +
      '</ul>'
  },
  {
    id:4, slug:'preparing-for-marriage-questions', category:'marriage-family',
    tags:['Marriage','Family','Counselling'], featured:false, ctaType:'counselling',
    title:'Preparing for Marriage: Questions Every Couple Should Discuss',
    subtitle:'A starting list of conversations worth having before the wedding, not after.',
    excerpt:'A starting list of conversations worth having before the wedding, not after.',
    author:AUTHOR, publishDate:'2026-07-15', updatedDate:null, readingTime:5, icon:'chair',
    content:
      '<p>Many couples spend more time planning a wedding day than planning the marriage that follows it. A handful of honest conversations before the wedding can prevent a great deal of difficulty later.</p>' +
      '<h2 id="expectations-around-daily-life">Expectations around daily life</h2>' +
      '<p>Questions worth discussing include how household responsibilities will be shared, how finances will be handled, and how much contact each of you expects to maintain with extended family.</p>' +
      '<h2 id="handling-disagreement">How you each handle disagreement</h2>' +
      '<p>It is worth discussing, calmly and before marriage, how each of you tends to behave during conflict, and what would help rather than escalate a disagreement.</p>' +
      '<div class="disclaimer">This article offers general discussion prompts and is not a substitute for structured pre-marital counselling, especially where deeper concerns exist.</div>' +
      '<h2 id="when-to-seek-support">When to seek outside support</h2>' +
      '<p>Some conversations are difficult to have without a neutral third party. This is where structured pre-marital counselling with a certified counsellor can help couples work through questions they might otherwise avoid.</p>'
  },
  {
    id:5, slug:'why-islamic-organisations-need-digital-systems', category:'technology',
    tags:['Technology','Organisations'], featured:false, ctaType:'technology',
    title:'Why Islamic Organisations Need Better Digital Systems',
    subtitle:'A slow website or a paper enrolment process quietly costs more than it seems to.',
    excerpt:'A slow website or a paper-based enrolment process quietly costs organisations more than they realize.',
    author:AUTHOR, publishDate:'2026-07-02', updatedDate:null, readingTime:4, icon:'laptop',
    content:
      '<p>Many Islamic organisations run meaningful programmes with outdated or manual systems behind the scenes, paper registers, spreadsheets emailed back and forth, a website that has not been updated in years.</p>' +
      '<h2 id="the-hidden-cost">The hidden cost of manual systems</h2>' +
      '<p>Manual processes do not just waste staff time. They make it harder to track student or client progress accurately, harder to communicate consistently, and harder for new families to trust an organisation at first glance.</p>' +
      '<h2 id="what-good-systems-look-like">What good systems tend to have in common</h2>' +
      '<ul>' +
        '<li>A clear, mobile-friendly website that explains what the organisation offers.</li>' +
        '<li>A single place to manage enrolment, scheduling and records.</li>' +
        '<li>Simple, reliable communication with the people the organisation serves.</li>' +
      '</ul>' +
      '<p>This is the thinking behind BaytulHub\u2019s own School Management and Learning Management Systems, and the digital services offered to other organisations facing the same challenges.</p>'
  },
  {
    id:6, slug:'truthfulness-in-business-fiqh-al-muamalat', category:'business',
    tags:['Business','Ethics','Entrepreneurship'], featured:false, ctaType:'none',
    title:"Truthfulness in Business: Applying Fiqh al-Mu'amalat",
    subtitle:'What honesty and fair dealing actually look like in ordinary daily decisions.',
    excerpt:'What it actually looks like to run a business on honesty and fair dealing, in ordinary daily decisions.',
    author:AUTHOR, publishDate:'2026-06-20', updatedDate:null, readingTime:5, icon:'briefcase',
    content:
      '<p>Fiqh al-mu\u2019amalat, the body of Islamic guidance on transactions and dealings, is often discussed in the abstract. In practice, it shows up in small, ordinary decisions.</p>' +
      '<h2 id="truthfulness-in-small-decisions">Truthfulness in small decisions</h2>' +
      '<p>It shows up in whether a delivery estimate is realistic or optimistic, whether a limitation of a product or service is mentioned upfront, and whether a mistake is corrected before or only after a customer notices.</p>' +
      '<h2 id="fair-dealing-as-a-habit">Fair dealing as a habit, not an event</h2>' +
      '<p>Fair dealing is easiest to practice as a habit built into how a business operates by default, rather than a decision made case by case under pressure.</p>' +
      '<div class="ref-box"><strong>Note on sources</strong><br>This article discusses general principles and is not a substitute for specific fiqh guidance on a particular business situation, which should be verified with a qualified scholar where needed.</div>' +
      '<h2 id="what-this-looks-like-day-to-day">What this looks like day to day</h2>' +
      '<ul>' +
        '<li>Pricing that does not depend on a customer not asking questions.</li>' +
        '<li>Keeping promises around timelines, even when it is inconvenient.</li>' +
        '<li>Being upfront about what a service does not include.</li>' +
      '</ul>'
  },
  {
    id:7, slug:'five-habits-strong-character-children', category:'character-development',
    tags:['Character','Children','Parenting'], featured:false, ctaType:'academy',
    title:'Five Habits That Build Strong Character in Children',
    subtitle:'Character develops through small repeated habits more than single lessons.',
    excerpt:'Character develops through small repeated habits more than through single lessons. Five worth starting with.',
    author:AUTHOR, publishDate:'2026-06-08', updatedDate:null, readingTime:4, icon:'character',
    content:
      '<p>Character is rarely built through a single conversation. It is built through small, repeated habits reinforced over time, at home as much as anywhere else.</p>' +
      '<h2 id="five-habits">Five habits worth building deliberately</h2>' +
      '<ol>' +
        '<li><strong>Truthfulness in small things.</strong> Correcting small exaggerations early makes honesty in bigger things more natural later.</li>' +
        '<li><strong>Owning mistakes.</strong> Praising a child for admitting a mistake, rather than only punishing the mistake itself, encourages honesty over cover-up.</li>' +
        '<li><strong>Following through on commitments.</strong> Small promises kept consistently build a habit of reliability.</li>' +
        '<li><strong>Empathy through practice.</strong> Regularly asking a child how someone else might feel builds the habit of considering others.</li>' +
        '<li><strong>Responsibility for a small task.</strong> A consistent chore or responsibility, however small, builds ownership over time.</li>' +
      '</ol>' +
      '<p>None of these habits are dramatic on their own. Their value comes from repetition, which is also why character development is woven into Academy lessons rather than treated as a separate subject.</p>'
  },

        if(entry.isIntersecting){
          links.forEach(function(l){ l.classList.remove('active'); });
          var match = tocWrap.querySelector('a[href="#' + entry.target.id + '"]');
          if(match) match.classList.add('active');
        }
      });
    }, { rootMargin: '-20% 0px -70% 0px' });
    headingEls.forEach(function(h){ obs.observe(h); });
  } else {
    tocWrap.style.display = 'none';
  }
}

document.getElementById('year').textContent = new Date().getFullYear();
render();
</script>

</body>
</html>
